<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Kitchen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16181c">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #16181c; overflow: hidden; }
  iframe { position: fixed; left: 0; top: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<!-- Outer frame: goes full screen once and never reloads. The dashboard inside can
     update itself without dropping out of full screen. -->
<iframe id="app" src="app.html?v=__BUILD__" allow="autoplay; fullscreen" allowfullscreen></iframe>
</body>
</html>
