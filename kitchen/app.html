<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Kitchen</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16181c">
<style>
  /* Written for old Android WebViews (Fire OS 5): flexbox only, no grid, no modern JS. */
  :root { }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f6f1e9; color: #2a2622;
    overflow: hidden; -webkit-user-select: none; user-select: none;
  }
  body.night { background: #16181c; color: #d9d4cc; }

  /* Fixed 1024x600 canvas, scaled by script to fit the actual screen (browser bars, kiosk, etc.) */
  .app { position: absolute; left: 0; top: 0; width: 1024px; height: 600px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; padding: 12px 16px 0; -webkit-transform-origin: 0 0; transform-origin: 0 0; }
  .main { display: -webkit-flex; display: flex; -webkit-flex: 1; flex: 1; min-height: 0; }

  /* Left column */
  .left { overflow: hidden; width: 340px; padding-right: 18px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .clock { font-size: 92px; font-weight: 300; line-height: 1; letter-spacing: -2px; }
  .date { font-size: 21px; margin-top: 4px; color: #8a6e4b; font-weight: 500; }
  body.night .date { color: #c9a878; }

  .now { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-top: 18px; }
  .now svg { width: 68px; height: 68px; margin-right: 12px; }
  .temp { font-size: 52px; font-weight: 600; line-height: 1; }
  .cond { font-size: 16px; color: #6b635a; margin-top: 4px; }
  body.night .cond { color: #a39c92; }

  .rain { margin-top: 12px; font-size: 14px; color: #6b635a; }
  .rain span { display: inline-block; margin-right: 10px; }
  .rain b { color: #2f6db3; }
  body.night .rain b { color: #7fb0ea; }

  .fc { display: -webkit-flex; display: flex; margin-top: 12px; }
  .fc .d { -webkit-flex: 1; flex: 1; background: #fffaf2; border-radius: 12px; padding: 8px 6px; margin-right: 6px; text-align: center; }
  .fc .d:last-child { margin-right: 0; }
  body.night .fc .d { background: #22262c; }
  .fc .dn { font-size: 14px; font-weight: 600; }
  .fc svg { width: 34px; height: 34px; margin: 2px 0; }
  .fc .hl { font-size: 14px; }
  .fc .rp { font-size: 12px; color: #2f6db3; }
  body.night .fc .rp { color: #7fb0ea; }

  .sun { margin-top: auto; padding-bottom: 10px; font-size: 15px; color: #6b635a; }
  .sun b { color: #2a2622; font-weight: 600; }
  body.night .sun, body.night .sun b { color: #a39c92; }

  /* Right column */
  .right { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; min-width: 0; }
  .h { font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: #8a6e4b; font-weight: 700; margin-bottom: 6px; }
  body.night .h { color: #c9a878; }
  .cal { -webkit-flex: 1; flex: 1; overflow: hidden; background: #fffaf2; border-radius: 16px; padding: 12px 16px; }
  body.night .cal { background: #1e2126; }
  .day { margin-bottom: 10px; }
  .dl { font-size: 15px; font-weight: 700; color: #8a6e4b; margin-bottom: 5px; }
  body.night .dl { color: #c9a878; }
  .pill { display: inline-block; font-size: 14px; font-weight: 600; padding: 3px 11px; border-radius: 14px; background: #f0e3cf; margin: 0 5px 5px 0; }
  body.night .pill { background: #3a3329; }
  .ev { display: -webkit-flex; display: flex; font-size: 18px; padding: 2px 0; }
  .ev .t { width: 64px; font-weight: 700; -webkit-flex-shrink: 0; flex-shrink: 0; }
  .ev .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .none { font-size: 16px; color: #a39c92; }

  .bottom { display: -webkit-flex; display: flex; margin-top: 10px; }
  .chores { -webkit-flex: 1; flex: 1; background: #fffaf2; border-radius: 16px; padding: 10px 14px; margin-right: 10px; min-width: 0; }
  body.night .chores { background: #1e2126; }
  .chores ul { list-style: none; }
  .chores li { font-size: 16px; padding: 1px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chores li:before { content: "\25A2  "; color: #8a6e4b; }
  .kids { width: 260px; background: #2f6db3; color: #fff; border-radius: 16px; padding: 10px 14px; }
  body.night .kids { background: #24456e; }
  .xmas { font-size: 19px; font-weight: 700; }
  .fact { font-size: 14px; margin-top: 5px; line-height: 1.3; }

  /* Radio bar */
  .radio { display: -webkit-flex; display: flex; -webkit-flex-wrap: wrap; flex-wrap: wrap; padding-top: 8px; margin-top: 8px; border-top: 1px solid #e3d8c7; }
  body.night .radio { border-top-color: #2c3036; }
  .radio .lbl { display: none; }
  .st { -webkit-flex: 1 1 14%; flex: 1 1 14%; height: 42px; margin: 0 6px 8px 0; border-radius: 21px; border: 2px solid #d9c9b1; background: transparent; color: inherit; font-size: 15px; font-weight: 600; font-family: inherit; }
  body.night .st { border-color: #3a3f46; }
  .st.on { background: #c0392b; border-color: #c0392b; color: #fff; }
  .st.loading { background: #f0e3cf; }
  body.night .st.loading { background: #3a3329; }
  .stop { margin-right: 0; }
  .status { position: fixed; right: 16px; top: 10px; font-size: 12px; color: #a39c92; }

  /* Fixed heights for old WebViews that don't shrink flex children.
     600 canvas = 12 top + 410 main + 140 radio + 38 spare at the bottom */
  .main { height: 410px; -webkit-flex: none; flex: none; }
  .left { height: 410px; }
  .right { height: 410px; }
  .cal { height: 248px; -webkit-flex: none; flex: none; }
  .bottom { height: 130px; overflow: hidden; }
  .chores, .kids { height: 130px; overflow: hidden; }
  .radio { height: 140px; overflow: hidden; padding-top: 14px; margin-top: 10px; }
  .st { height: 44px; margin: 0 12px 14px 0; }
  .stop { margin-right: 0; }

  /* Countdown and fact: two stacked half-height boxes */
  .kidcol { width: 340px; height: 130px; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; }
  .xbox, .fbox { height: 60px; border-radius: 14px; padding: 8px 14px; overflow: hidden; }
  .xbox { background: #2f6db3; color: #fff; margin-bottom: 10px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; }
  .fbox { background: #f2c14e; color: #3a2c10; }
  body.night .xbox { background: #24456e; }
  body.night .fbox { background: #6b5320; color: #f6ead0; }
  .xmas { font-size: 21px; font-weight: 700; }
  .fh { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; font-weight: 700; opacity: .75; }
  .fact { font-size: 14px; margin-top: 2px; line-height: 1.25; }

  /* Larger weather text for readability */
  .left { width: 390px; }
  .clock { font-size: 88px; }
  .date { font-size: 24px; }
  .now { margin-top: 14px; }
  .now svg { width: 76px; height: 76px; }
  .temp { font-size: 62px; }
  .cond { font-size: 21px; margin-top: 2px; }
  .rain { font-size: 17px; margin-top: 10px; }
  .fc { margin-top: 10px; }
  .fc .d { padding: 6px 4px; }
  .fc .dn { font-size: 18px; }
  .fc svg { width: 40px; height: 40px; margin: 0; }
  .fc .hl { font-size: 20px; font-weight: 600; }
  .fc .rp { font-size: 16px; font-weight: 600; }
  .sun { font-size: 19px; }

  /* 8 stations + Stop: 5 per row, larger text */
  .st { -webkit-flex: 1 1 17%; flex: 1 1 17%; font-size: 17px; }

  /* Calendar: two columns (Today | Tomorrow); slimmer chores row gives the calendar more height */
  .cal { height: 270px !important; background: transparent !important; padding: 0 !important; border-radius: 0; display: -webkit-flex; display: flex; }
  .col { -webkit-flex: 1; flex: 1; min-width: 0; height: 270px; overflow: hidden; background: #fffaf2; border-radius: 16px; padding: 10px 14px; }
  .col.today { margin-right: 10px; border-top: 5px solid #c0392b; padding-top: 7px; }
  body.night .col { background: #1e2126; }
  .col .dl { font-size: 17px; margin-bottom: 6px; }
  .dsub { font-weight: 500; opacity: .7; }
  .col .pill { font-size: 15px; margin: 0 0 6px 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col .ev { font-size: 17px; padding: 3px 0; line-height: 1.25; }
  .col .ev .t { width: 56px; }
  .col .ev .n { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .more { font-size: 15px; font-weight: 700; color: #8a6e4b; padding-top: 2px; }
  body.night .more { color: #c9a878; }
  .bottom, .chores, .kids, .kidcol { height: 108px !important; }
  .chores { padding: 8px 14px; }
  .chores li { font-size: 16px; padding: 0; }
  .xbox { height: 40px; margin-bottom: 8px; padding: 0 14px; }
  .xmas { font-size: 19px; }
  .fbox { height: 60px; padding: 6px 14px; }
  .fact { font-size: 14px; line-height: 1.2; }

  .it.pi { display: inline-block; max-width: 100%; margin-right: 6px; vertical-align: top; }
  .rain { white-space: nowrap; overflow: hidden; }

  /* Keep every weather line full height; trim clock/icons slightly so it all fits */
  .left > * { -webkit-flex-shrink: 0; flex-shrink: 0; }
  .clock { font-size: 80px; }
  .now { margin-top: 10px; }
  .now svg { width: 62px; height: 62px; }
  .temp { font-size: 58px; }
  .rain { margin-top: 8px; height: 22px; }
  .fc { margin-top: 8px; }
  .fc svg { width: 32px; height: 32px; }

  /* Balance spacing now fit is confirmed on the Fire: 22 top, 418 main, 140 radio, 20 bottom */
  .app { padding-top: 22px !important; }
  .main, .left, .right { height: 418px !important; }
  .cal, .col { height: 278px !important; }

  /* Playing station = green; Stop = solid red so it stands out */
  .st.on { background: #2e8b57 !important; border-color: #2e8b57 !important; color: #fff !important; }
  .st.stop { background: #c0392b !important; border-color: #c0392b !important; color: #fff !important; font-weight: 700; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="main">
    <div class="left">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
      <div class="now"><span id="nowIcon"></span><div><div class="temp" id="temp">--°</div><div class="cond" id="cond"></div></div></div>
      <div class="rain" id="rain"></div>
      <div class="fc" id="fc"></div>
      <div class="sun" id="sun"></div>
    </div>
    <div class="right">
      <div class="h">Family calendar</div>
      <div class="cal" id="cal"></div>
      <div class="bottom">
        <div class="chores"><div class="h">Chores</div><ul id="chores"></ul></div>
        <div class="kidcol"><div class="xbox"><div class="xmas" id="xmas"></div></div><div class="fbox"><div class="fh">Did you know?</div><div class="fact" id="fact"></div></div></div>
      </div>
    </div>
  </div>
  <div class="radio" id="radio"><span class="lbl">Radio</span></div>
</div>
<div class="status" id="status"></div><div id="upd" style="position:fixed;left:8px;bottom:3px;font-size:12px;opacity:.55"></div>
<audio id="player" preload="none"></audio>

<script>
(function () {
  // ---- Radio stations: edit freely. HLS (.m3u8) and plain MP3/AAC URLs both work. ----
  var STATIONS = [
    { name: "Radio 4",   url: "https://lsn.lv/bbcradio.m3u8?station=bbc_radio_fourfm&bitrate=320000" },
    { name: "Radio 1",   url: "https://lsn.lv/bbcradio.m3u8?station=bbc_radio_one&bitrate=320000" },
    { name: "BBC CWR",   url: "https://lsn.lv/bbcradio.m3u8?station=bbc_radio_coventry_warwickshire&bitrate=320000" },
    { name: "4 Extra",   url: "https://lsn.lv/bbcradio.m3u8?station=bbc_radio_four_extra&bitrate=320000" },
    { name: "Classic FM",   url: "https://media-ssl.musicradio.com/ClassicFMMP3" },
    { name: "Capital XTRA", url: "https://media-ssl.musicradio.com/CapitalXTRANationalMP3" },
    { name: "LBC News",     url: "https://media-ssl.musicradio.com/LBCNewsUKMP3" },
    { name: "Fun Kids",     url: "https://listen-funkids.sharp-stream.com/funkids.mp3" }
  ];
  var DATA_URL = "data.json";
  var PAGE_BUILD = "__BUILD__";  // replaced with the build id when published
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  // ---- Weather icons (inline SVG, keyed by the Kindle glyph) ----
  var SUN = '<circle cx="32" cy="32" r="12" fill="#f2b632"/><g stroke="#f2b632" stroke-width="4" stroke-linecap="round"><line x1="32" y1="6" x2="32" y2="13"/><line x1="32" y1="51" x2="32" y2="58"/><line x1="6" y1="32" x2="13" y2="32"/><line x1="51" y1="32" x2="58" y2="32"/><line x1="13.6" y1="13.6" x2="18.5" y2="18.5"/><line x1="45.5" y1="45.5" x2="50.4" y2="50.4"/><line x1="13.6" y1="50.4" x2="18.5" y2="45.5"/><line x1="45.5" y1="18.5" x2="50.4" y2="13.6"/></g>';
  var CLOUD = '<path d="M20 46h26a10 10 0 0 0 0-20 14 14 0 0 0-27-2 11 11 0 0 0 1 22z" fill="#b7c0cc"/>';
  var ICONS = {
    "☀": SUN,
    "☁": CLOUD,
    "☂": CLOUD + '<g stroke="#2f6db3" stroke-width="3.5" stroke-linecap="round"><line x1="24" y1="51" x2="21" y2="59"/><line x1="34" y1="51" x2="31" y2="59"/><line x1="44" y1="51" x2="41" y2="59"/></g>',
    "❄": CLOUD + '<g fill="#7fb0ea"><circle cx="23" cy="54" r="3"/><circle cx="33" cy="57" r="3"/><circle cx="43" cy="54" r="3"/></g>',
    "⚡": CLOUD + '<path d="M34 44l-8 12h7l-3 8 10-13h-7l3-7z" fill="#f2b632"/>'
  };
  function icon(g) { return '<svg viewBox="0 0 64 64">' + (ICONS[g] || CLOUD) + '</svg>'; }

  // ---- Clock, date, countdown, night mode ----
  function tick() {
    var d = new Date();
    $("clock").innerHTML = pad(d.getHours()) + ":" + pad(d.getMinutes());
    $("date").innerHTML = DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
    var h = d.getHours();
    document.body.className = "night";
    var xmas = new Date(d.getFullYear(), 11, 25);
    var today = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (today > xmas) xmas = new Date(d.getFullYear() + 1, 11, 25);
    var n = Math.round((xmas - today) / 86400000);
    $("xmas").innerHTML = n === 0 ? "Happy Christmas!" : (n === 1 ? "1 sleep till Christmas!" : "&#9733; " + n + " sleeps till Christmas");
  }

  // ---- Data ----
  function dayLabel(iso) {
    var p = iso.split("-"), d = new Date(+p[0], +p[1] - 1, +p[2]);
    var t = new Date(); t = new Date(t.getFullYear(), t.getMonth(), t.getDate());
    var diff = Math.round((d - t) / 86400000);
    if (diff < 0) return null;
    if (diff === 0) return "Today";
    if (diff === 1 && !arguments[1]) return DAYS[d.getDay()];
    if (diff === 1) return "Tomorrow";
    return DAYS[d.getDay()];
  }

  // ---- Live weather straight from Open-Meteo (doesn't depend on the GitHub build) ----
  var lastData = null, liveW = null, liveAt = 0;
  var WMO_LABEL = {0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Freezing fog",
    51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",56:"Freezing drizzle",57:"Freezing drizzle",
    61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",71:"Light snow",73:"Snow",
    75:"Heavy snow",77:"Snow grains",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",
    95:"Thunderstorm",96:"Thunder + hail",99:"Thunder + hail"};
  function wmoGlyph(c) {
    if (c <= 1) return "\u2600";
    if (c <= 48) return "\u2601";
    if (c >= 95) return "\u26A1";
    if ((c >= 71 && c <= 77) || c === 85 || c === 86) return "\u2744";
    return "\u2602";
  }
  function parseLocal(t) { // "2026-11-08T15:00" -> local Date
    var a = t.split("T"), d = a[0].split("-"), h = (a[1] || "00:00").split(":");
    return new Date(+d[0], +d[1] - 1, +d[2], +h[0], +h[1]);
  }
  function loadWeather() {
    var url = "https://api.open-meteo.com/v1/forecast?latitude=52.41&longitude=-1.47" +
      "&current=temperature_2m,weather_code,wind_speed_10m&hourly=precipitation_probability" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset" +
      "&timezone=Europe%2FLondon&forecast_days=5&wind_speed_unit=mph";
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4 || x.status !== 200) return;
      try {
        var d = JSON.parse(x.responseText), c = d.current, dy = d.daily, hr = d.hourly, i;
        var now = new Date(), rain = [], days = [];
        for (i = 0; i < hr.time.length && rain.length < 4; i++) {
          var ts = parseLocal(hr.time[i]);
          if (ts >= now && ts - now <= 12 * 3600000 && ts.getHours() % 3 === 0)
            rain.push([pad(ts.getHours()) + ":00", hr.precipitation_probability[i]]);
        }
        for (i = 0; i < dy.time.length; i++) {
          days.push({ date: dy.time[i], glyph: wmoGlyph(dy.weather_code[i]), label: WMO_LABEL[dy.weather_code[i]] || "",
                      hi: Math.round(dy.temperature_2m_max[i]), lo: Math.round(dy.temperature_2m_min[i]),
                      rain: dy.precipitation_probability_max[i] });
        }
        liveW = { now_temp: Math.round(c.temperature_2m), now_glyph: wmoGlyph(c.weather_code),
                  now_label: WMO_LABEL[c.weather_code] || "", wind: Math.round(c.wind_speed_10m),
                  sunrise: dy.sunrise[0].slice(-5), sunset: dy.sunset[0].slice(-5), rain_next: rain, days: days };
        liveAt = Date.now();
        if (lastData) draw(lastData);
      } catch (e) {}
    };
    x.send();
  }

  function draw(data) {
    lastData = data;
    var w = (liveW && Date.now() - liveAt < 3 * 3600000) ? liveW : data.weather, i, html;
    $("nowIcon").innerHTML = icon(w.now_glyph);
    $("temp").innerHTML = w.now_temp + "°";
    $("cond").innerHTML = esc(w.now_label) + " &middot; wind " + w.wind + " mph";
    html = "";
    for (i = 0; i < w.rain_next.length && i < 3; i++) {
      html += "<span>" + w.rain_next[i][0] + " <b>" + w.rain_next[i][1] + "%</b></span>";
    }
    $("rain").innerHTML = html ? "Rain &nbsp;" + html : "";
    html = "";
    var shown = 0;
    for (i = 0; i < w.days.length && shown < 4; i++) {
      var dd = w.days[i], lab = dayLabel(dd.date);
      if (lab === null) continue;  // a day that's already gone (stale data)
      shown++;
      html += '<div class="d"><div class="dn">' + (lab === "Today" ? "Today" : lab.slice(0, 3)) + "</div>" + icon(dd.glyph) +
              '<div class="hl">' + dd.hi + "° / " + dd.lo + '°</div><div class="rp">' + dd.rain + "%</div></div>";
    }
    $("fc").innerHTML = html;
    $("sun").innerHTML = "Sunrise <b>" + w.sunrise + "</b> &nbsp;&middot;&nbsp; Sunset <b>" + w.sunset + "</b>";

    // Calendar: Today and Tomorrow side by side, each fitted with "+N more"
    function isoOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
    var c0 = new Date(), c1 = new Date(c0.getFullYear(), c0.getMonth(), c0.getDate() + 1);
    var cols = [[isoOf(c0), "Today", ""], [isoOf(c1), "Tomorrow", DAYS[c1.getDay()]]];
    html = "";
    for (i = 0; i < cols.length; i++) {
      var evs = [], j, k, items = "";
      for (k = 0; k < data.calendar.length; k++) if (data.calendar[k].date === cols[i][0]) evs = data.calendar[k].events;
      for (j = 0; j < evs.length; j++) if (!evs[j].time) items += '<div class="it pi"><span class="pill">' + esc(evs[j].title) + "</span></div>";
      for (j = 0; j < evs.length; j++) if (evs[j].time) items += '<div class="it ev"><span class="t">' + evs[j].time + '</span><span class="n">' + esc(evs[j].title) + "</span></div>";
      html += '<div class="col' + (i === 0 ? " today" : "") + '"><div class="dl">' + cols[i][1] +
              (cols[i][2] ? ' <span class="dsub">' + cols[i][2] + "</span>" : "") + '</div><div class="items">' +
              (items || '<div class="none">Nothing on</div>') + "</div></div>";
    }
    $("cal").innerHTML = html;
    // Trim each column to fit, replacing hidden items with "+N more"
    var colEls = $("cal").getElementsByClassName("col");
    for (i = 0; i < colEls.length; i++) {
      var col = colEls[i], box = col.getElementsByClassName("items")[0], hidden = 0, more = null;
      while (col.scrollHeight > col.clientHeight + 1) {
        var its = box.getElementsByClassName("it");
        if (!its.length) break;
        box.removeChild(its[its.length - 1]); hidden++;
        if (!more) { more = document.createElement("div"); more.className = "more"; box.appendChild(more); }
        more.innerHTML = "+" + hidden + " more";
      }
    }

    html = "";
    for (i = 0; i < data.chores.length && i < 4; i++) html += "<li>" + esc(data.chores[i]) + "</li>";
    if (data.chores.length > 4) html += "<li>+" + (data.chores.length - 4) + " more</li>";
    $("chores").innerHTML = html || '<li class="none">No chores listed</li>';
    $("fact").innerHTML = esc(data.fact || "");
    var age = (Date.now() - new Date(data.generated).getTime()) / 60000;
    $("upd").innerHTML = "Updated " + data.generated.slice(11, 16) + " &middot; " + (PAGE_BUILD.charAt(0) === "_" ? "dev" : PAGE_BUILD);
    // A newer version has been published: reload (but never interrupt the radio)
    if (data.build && PAGE_BUILD.charAt(0) !== "_" && data.build !== PAGE_BUILD && current < 0) {
      location.replace(location.pathname + "?v=" + data.build);
    }
    $("status").innerHTML = age > 720 ? "&#9888; Calendar last updated " + data.generated.slice(11, 16) + (age > 1440 ? " (over a day ago)" : "") : "";
  }

  function load() {
    var x = new XMLHttpRequest();
    x.open("GET", DATA_URL + "?t=" + Date.now(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status === 200) {
        try { draw(JSON.parse(x.responseText)); } catch (e) { $("status").innerHTML = "Data error"; }
      } else {
        $("status").innerHTML = "Offline &ndash; showing last update";
      }
    };
    x.send();
  }

  // ---- Radio ----
  var player = $("player"), hls = null, current = -1, buttons = [];
  var nativeHls = !!player.canPlayType && player.canPlayType("application/vnd.apple.mpegurl") !== "";

  function setState(idx, cls) {
    for (var i = 0; i < buttons.length; i++) buttons[i].className = "st" + (i === idx && cls ? " " + cls : "");
  }
  function stopRadio() {
    if (hls) { hls.destroy(); hls = null; }
    player.pause(); player.removeAttribute("src"); try { player.load(); } catch (e) {}
    current = -1; setState(-1);
  }
  function startUrl(url) {
    var isHls = /\.m3u8/.test(url);
    if (isHls && !nativeHls && window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls(); hls.loadSource(url); hls.attachMedia(player);
      hls.on(window.Hls.Events.MANIFEST_PARSED, function () { player.play(); });
      hls.on(window.Hls.Events.ERROR, function (ev, d) { if (d && d.fatal) { $("status").innerHTML = "Station unavailable"; stopRadio(); } });
    } else {
      player.src = url; player.play();
    }
  }
  function play(idx) {
    if (idx === current) { stopRadio(); return; }
    stopRadio(); $("status").innerHTML = ""; current = idx; setState(idx, "loading");
    var url = STATIONS[idx].url;
    if (/\.m3u8/.test(url) && !nativeHls && !window.Hls) {
      var s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js";
      s.onload = function () { if (current === idx) startUrl(url); };
      s.onerror = function () { $("status").innerHTML = "Couldn't load radio player"; stopRadio(); };
      document.head.appendChild(s);
    } else {
      startUrl(url);
    }
  }
  player.addEventListener("playing", function () { if (current >= 0) { setState(current, "on"); $("status").innerHTML = ""; } });
  player.addEventListener("error", function () {
    // Ignore errors from clearing the previous station (no source, or not the station we asked for)
    if (current < 0 || hls) return;
    var src = player.getAttribute("src");
    if (!src || src !== STATIONS[current].url) return;
    $("status").innerHTML = "Station unavailable"; stopRadio();
  });

  function buildRadio() {
    var bar = $("radio");
    for (var i = 0; i < STATIONS.length; i++) {
      var b = document.createElement("button");
      b.className = "st"; b.innerHTML = esc(STATIONS[i].name);
      (function (k) { b.addEventListener("click", function () { play(k); }); })(i);
      bar.appendChild(b); buttons.push(b);
    }
    var stop = document.createElement("button");
    stop.className = "st stop"; stop.innerHTML = "&#9632; Stop";
    stop.addEventListener("click", stopRadio);
    bar.appendChild(stop);
  }

  // Scale the 1024x600 canvas to fit the visible area, centred.
  function fit() {
    var de = document.documentElement;
    var w = Math.min(window.innerWidth, de.clientWidth || 9999, screen.width || 9999);
    var h = Math.min(window.innerHeight, de.clientHeight || 9999, screen.height || 9999);
    var sc = Math.min(w / 1024, h / 600);
    var x = Math.max(0, (w - 1024 * sc) / 2), y = Math.max(0, (h - 600 * sc) / 2);
    var t = "translate(" + x + "px," + y + "px) scale(" + sc + ")";
    var a = $("app"); a.style.webkitTransform = t; a.style.transform = t;
  }
  // Go full screen on the first tap anywhere (browsers only allow this after a tap).
  function goFull() {
    var doc = document;
    try { if (window.parent !== window && window.parent.document) doc = window.parent.document; } catch (e) {}
    var el = doc.documentElement;
    if (doc.fullscreenElement || doc.webkitFullscreenElement) return;
    var req = el.requestFullscreen || el.webkitRequestFullscreen || el.webkitRequestFullScreen;
    if (req) { try { req.call(el); } catch (e) {} }
  }
  document.addEventListener("click", goFull, true);
  document.addEventListener("touchend", goFull, true);
  window.addEventListener("resize", fit);
  document.addEventListener("fullscreenchange", function () { setTimeout(fit, 300); });
  document.addEventListener("webkitfullscreenchange", function () { setTimeout(fit, 300); });
  // Old browsers can report the size late after going full screen: re-check for a while
  var fitCount = 0, fitTimer = setInterval(function () { fit(); if (++fitCount > 20) clearInterval(fitTimer); }, 1000);
  document.addEventListener("touchend", function () { fitCount = 0; }, true);
  window.addEventListener("orientationchange", function () { setTimeout(fit, 300); });
  fit();

  buildRadio();
  tick(); load(); loadWeather();
  setInterval(tick, 10000);
  setInterval(load, 5 * 60 * 1000);
  setInterval(loadWeather, 15 * 60 * 1000);
  // Reload the whole page every 6 hours (when the radio is off) to pick up any design changes.
  setInterval(function () { if (current < 0) location.reload(); }, 6 * 60 * 60 * 1000);
})();
</script>
</body>
</html>
