name: Build Kindle dashboard

on:
  schedule:
    # Every 30 min, all day, at off-peak minutes (GitHub delays or drops runs at :00/:30).
    # Scheduled runs can still be late or skipped occasionally; the pages show a warning if data is stale.
    - cron: "13,43 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.name.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fonts and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core
          pip install -r requirements.txt

      - name: Render dashboard
        env:
          ICAL_URL: ${{ secrets.ICAL_URL }}
        run: python dashboard/main.py

      - name: Give the image its private name
        id: name
        env:
          IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
        run: |
          test -n "$IMAGE_NAME" || { echo "Set the IMAGE_NAME secret"; exit 1; }
          if [ ! -f public/dash.png ]; then echo "Nothing new to publish this time"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          mv public/dash.png "public/${IMAGE_NAME}.png"
          # Colour kitchen page (Fire tablet) lives under the same private name
          mkdir -p "public/${IMAGE_NAME}"
          cp kitchen/* "public/${IMAGE_NAME}/"
          # Stamp the page with this build so open copies can spot a newer version and reload
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" "public/${IMAGE_NAME}/index.html" "public/${IMAGE_NAME}/app.html"
          mv public/data.json "public/${IMAGE_NAME}/data.json"
          echo "nothing to see here" > public/index.html

      - uses: actions/upload-pages-artifact@v3
        if: steps.name.outputs.publish == 'true'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
